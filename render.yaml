services:
  - type: web
    name: kto-pered-vami
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # deepseek (demo) | anthropic (production). Only the selected provider's key is needed.
      - key: AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_CALLS_PER_HOUR
        value: "300"
      # Telegram login + subscription. Without these the AI trainings stay closed (test and flags still work).
      - key: AUTORIZATION_BOT
        sync: false # bot token from @BotFather
      - key: TELEGRAM_CHAT_ID
        sync: false # channel/chat whose members get full access, e.g. -1001234567890; the bot must be an admin there
      - key: TELEGRAM_CHANNEL_URL
        sync: false # invite link shown on the subscription screen
      - key: SESSION_SECRET
        generateValue: true # signs sessions and tickets; changing it logs everyone out
      # PostHog project API key (phc_...). Empty = analytics off.
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
